name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No crawled data in the repo
        run: "! git ls-files | grep -E '(^|/)data/|\\.(html?|gz|csv|tsv|jsonl|ndjson|parquet|db|sqlite3?|warc)$'"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --no-group lessons

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag soundshark:ci .

      - name: The image runs
        run: docker run --rm soundshark:ci --help

[project]
name = "soundshark"
version = "0.0.1"
description = "Map a music scene: crawl DJ lineups into a graph, then find who really sounds alike."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "networkx>=3.7",
    "numpy>=2.3",
    "python-dotenv>=1.0",
    "python-igraph>=0.11",
    "rapidfuzz>=3.14.6",
    "scipy>=1.16",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=26.1.0",
]

[project.scripts]
soundshark = "soundshark.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright[nodejs]>=1.1.390",
    "hypothesis>=6.170.15",
]
lessons = [
    "beautifulsoup4>=4.12",
]

[tool.uv]
default-groups = ["dev", "lessons"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundshark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnusedCoroutine = "error"
